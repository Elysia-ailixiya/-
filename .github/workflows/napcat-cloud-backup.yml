name: NapCatQQ Cloud Backup
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: napcat-cloud-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup-control-20261116
          persist-credentials: false
      - name: Copy repository and all release assets directly on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_SSH_KEY: ${{ secrets.NAPCAT_BACKUP_TEMP_KEY }}
        run: python3 .github/scripts/cloud_backup.py
